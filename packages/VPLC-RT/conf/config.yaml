host: "192.168.37.18" # S7 http websocket 服务主机地址
port: 8078 # http and ws serve port
description: "孤岛站孤永线出口"
areas: # 可以设置多个数据区
- comment: 数据区 1
  name: node_data
  type: DB # DB块
  DBNO: 1 # DB块号
  # bytes: 50 # DB块长度
  tags: # 分别定义各个变量在数据块中的位置
  - name: basic
    type: STRUCT
    tags:
    - { name: node_ID, type: INT, value: 8078, comment: 节点ID }
    - { name: comm_OK, type: BOOL, value: true, comment: 用于维护节点通讯状态 }
    - { name: work_OK, type: BOOL, value: true, comment: 用于维护节点工作状态 }
    - { name: pump_run, type: BOOL, value: false, comment: 本节点有泵运行 }
    - { name: pump_change_F, type: BOOL, value: false, comment: 本节点是否处于泵操作延时 }
    - { name: pump_run_1, type: BOOL, value: false, comment: 1#泵运行状态 }
    - { name: pump_run_2, type: BOOL, value: false, comment: 2#泵运行状态 }
    - { name: pump_run_3, type: BOOL, value: false, comment: 3#泵运行状态 }
    - { name: pump_run_4, type: BOOL, value: false, comment: 4#泵运行状态 }
    - { name: temperature_AH_F, type: BOOL, value: false, comment: 温度上上限标志 }
    - { name: temperature_WH_F, type: BOOL, value: false, comment: 温度上限标志 }
    - { name: temperature_WL_F, type: BOOL, value: false, comment: 温度下限标志 }
    - { name: temperature_AL_F, type: BOOL, value: false, comment: 温度下下限标志 }
    - { name: pressure_AH_F, type: BOOL, value: false, comment: 压力上上限标志 }
    - { name: pressure_WH_F, type: BOOL, value: false, comment: 压力上限标志 }
    - { name: pressure_WL_F, type: BOOL, value: false, comment: 压力下限标志 }
    - { name: pressure_AL_F, type: BOOL, value: false, comment: 压力下下限标志 }
    - { name: temperature, type: REAL, value: 0.0, comment: 温度值 }
    - { name: pressure, type: REAL, value: 0.0, comment: 压力值 }
    - { name: flowmeter, type: REAL, value: 0.0, comment: 流量值 }
    - { name: response_code, type: UINT, value: 0, comment: 执行应答 }
  - &para
    name: para
    type: STRUCT
    tags:
    - { name: temperature_zero_raw, type: INT, value: 0, comment: 模块原始零点值 }
    - { name: temperature_span_raw, type: INT, value: 27648, comment: 模块原始量程值 }
    - { name: temperature_zero, type: REAL, value: 0, comment: 零点值 }
    - { name: temperature_span, type: REAL, value: 100, comment: 量程值 }
    - { name: temperature_AH, type: REAL, value: 100, comment: 高高值 }
    - { name: temperature_WH, type: REAL, value: 100, comment: 高值 }
    - { name: temperature_WL, type: REAL, value: 0, comment: 低值 }
    - { name: temperature_AL, type: REAL, value: 0, comment: 低低值 }
    - { name: temperature_DZ, type: REAL, value: 0, comment: 温度比较死区 }
    - { name: temperature_FT, type: DINT, value: 0, comment: 温度比较容错时间 }
    - { name: pressure_zero_raw, type: INT, value: 0, comment: 模块原始零点值 }
    - { name: pressure_span_raw, type: INT, value: 27648, comment: 模块原始量程值 }
    - { name: pressure_zero, type: REAL, value: 0, comment: 零点值 }
    - { name: pressure_span, type: REAL, value: 4, comment: 量程值 }
    - { name: pressure_AH, type: REAL, value: 1, comment: 高高值 }
    - { name: pressure_WH, type: REAL, value: 1, comment: 高值 }
    - { name: pressure_WL, type: REAL, value: 0, comment: 低值 }
    - { name: pressure_AL, type: REAL, value: 0, comment: 低低值 }
    - { name: pressure_DZ, type: REAL, value: 0, comment: 压力比较死区 }
    - { name: pressure_FT, type: DINT, value: 0, comment: 压力比较容错时间 }
    - { name: flow_1, type: REAL, value: 0, comment: 流量1}
    - { name: flow_2, type: REAL, value: 0, comment: 流量2}
    - { name: flow_3, type: REAL, value: 0, comment: 流量3}
    - { name: flow_4, type: REAL, value: 0, comment: 流量4}
    - { name: flow_5, type: REAL, value: 0, comment: 流量5}
    - { name: flow_smooth_factor, type: REAL, value: 0, comment: 流量平滑权值}
    - { name: equS1, type: DINT, value: 0, comment: 流量1当量 }
    - { name: equS2, type: DINT, value: 0, comment: 流量2当量 }
    - { name: equS3, type: DINT, value: 0, comment: 流量3当量 }
    - { name: equS4, type: DINT, value: 0, comment: 流量4当量 }
    - { name: equS5, type: DINT, value: 0, comment: 流量5当量 }
    - { name: pump_change_delay, type: DINT, value: 2000, comment: 泵操作延时 }

- comment: 数据区 2
  name: commands
  type: DB # DB块
  DBNO: 2 # DB块号
  # bytes: 50 # DB块长度
  tags: # 分别定义各个变量在数据块中的位置
  - name: basic
    type: STRUCT
    tags:
    - { name: "node_ID", type: "INT", comment: "节点ID" }
    - { name: "stop_pumps", type: "BOOL", comment: "停泵命令" }
    - { name: "stop_heaters", type: "BOOL", comment: "保留" }
    - { name: "horn", type: "BOOL", comment: "输出报警" }
    - { name: "reset_horn", type: "BOOL", comment: "停止报警" }
    - { name: "reset_CPU", type: "BOOL", comment: "预留" }
    - { name: "reset_conn", type: "BOOL", comment: "预留" }
    - { name: "read_paras", type: "BOOL", comment: "读取所有参数" }
    - { name: "write_paras", type: "BOOL", comment: "写参数命令" }
  - *para
