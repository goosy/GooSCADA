# 本配置文件用于指定要建立的连接参数
# 可以设置多个连接，每个连接单独定义
- name: GD8                    # 连接名称
  port: 2078                   # 客户端连接到目标主机的端口（必须）
  host: 192.168.25.51          # 客户端连接到的目标主机。默认 'localhost'
  localAddress: 192.168.37.18  # 网络连接绑定的本地接口
  localPort: 2078              # 网络连接绑定的本地端口
  family: 4                    # IP 栈版本，可用值4和6。默认 4
  type: TCP                    # 通信协议类型
  active: true                 # 是否为主动连接
  send: node_data.basic                  # 定义发送区在 vplc中的对应结构位置: `区域名.变量名1.变量名2...`
  receive: commands            # 定义接收区在 vplc中的对应结构位置: `区域名.变量名1.变量名2...`
